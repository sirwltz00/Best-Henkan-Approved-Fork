name: Build Windows application

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and package Henkan for Windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyinstaller

      - name: Run regression tests
        run: python -m pytest -q

      - name: Build windowed Henkan application
        shell: pwsh
        run: |
          # Resolve sources from the repository root before PyInstaller writes its .spec.
          # Relative --add-data inputs would be resolved under build/spec-gui or
          # build/spec-worker because those custom spec directories are configured below.
          $idTables = (Resolve-Path "v3v2/idtables.json").Path
          $v2JapaneseUnits = (Resolve-Path "v3v2/v2_japanese_units.json").Path
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name Henkan `
            --distpath dist/gui --workpath build/gui --specpath build/spec-gui `
            --collect-all customtkinter --collect-all numpy `
            --add-data "$idTables;v3v2" `
            --add-data "$v2JapaneseUnits;v3v2" `
            henkan_app.py

      - name: Build internal console worker
        shell: pwsh
        run: |
          $idTables = (Resolve-Path "v3v2/idtables.json").Path
          $v2JapaneseUnits = (Resolve-Path "v3v2/v2_japanese_units.json").Path
          python -m PyInstaller --clean --noconfirm --onefile --console --name HenkanWorker `
            --distpath dist/worker --workpath build/worker --specpath build/spec-worker `
            --collect-all numpy --collect-all pywinauto `
            --hidden-import pythoncom --hidden-import pywintypes --hidden-import win32timezone `
            --hidden-import win32api --hidden-import win32con --hidden-import win32gui `
            --hidden-import win32process --hidden-import win32event --hidden-import win32com.client `
            --add-data "$idTables;v3v2" `
            --add-data "$v2JapaneseUnits;v3v2" `
            henkan_worker.py

      - name: Smoke-test frozen executables
        shell: pwsh
        run: |
          & "dist/gui/Henkan.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Henkan GUI bundle self-test failed ($LASTEXITCODE)." }
          & "dist/worker/HenkanWorker.exe" --cli --version
          if ($LASTEXITCODE -ne 0) { throw "HenkanWorker CLI self-test failed ($LASTEXITCODE)." }
          & "dist/worker/HenkanWorker.exe" --qa
          if ($LASTEXITCODE -ne 0) { throw "HenkanWorker Audio QA self-test failed ($LASTEXITCODE)." }

      - name: Assemble Windows application ZIP
        shell: pwsh
        run: |
          $release = "dist/Henkan-Windows"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item "dist/gui/Henkan.exe" $release
          Copy-Item "dist/worker/HenkanWorker.exe" $release
          Copy-Item "README.md" $release
          Copy-Item "LICENSE" $release
          Copy-Item "BUILDING_WINDOWS.md" $release
          Copy-Item "SYSTEM_REQUIREMENTS.md" $release
          @'
          HENKAN — WINDOWS BUILD

          Launch Henkan.exe. Keep HenkanWorker.exe in the same folder; it is used internally
          for conversion, validation, DBTool automation, packaging and Audio QA.
          Read SYSTEM_REQUIREMENTS.md or open PC Requirements in Henkan to check your PC.

          VocaloidDBTool3.exe and its phonetic dictionaries are external prerequisites.
          They are not bundled or downloaded by this build. Configure their paths in Henkan.
          '@ | Set-Content -Encoding UTF8 "$release/START-HERE.txt"
          if (!(Test-Path "$release/Henkan.exe") -or !(Test-Path "$release/HenkanWorker.exe")) {
            throw "One or more expected executable files are missing."
          }
          Compress-Archive -Path "$release/*" -DestinationPath "dist/Henkan-Windows.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Henkan-Windows
          path: dist/Henkan-Windows.zip
          if-no-files-found: error
          retention-days: 30
