name: Build Windows application

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and package Henkan for Windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyinstaller

      - name: Run regression tests
        run: python -m pytest -q

      - name: Build windowed Henkan application
        shell: pwsh
        run: |
          # Resolve sources from the repository root before PyInstaller writes its .spec.
          # Relative --add-data inputs would be resolved under build/spec-gui or
          # build/spec-worker because those custom spec directories are configured below.
          $idTables = (Resolve-Path "v3v2/idtables.json").Path
          $v2JapaneseUnits = (Resolve-Path "v3v2/v2_japanese_units.json").Path
          python -m PyInstaller --clean --noconfirm --onedir --windowed --name Henkan `
            --contents-directory _henkan_gui_runtime `
            --distpath dist/gui --workpath build/gui --specpath build/spec-gui `
            --collect-all customtkinter --collect-all numpy `
            --add-data "$idTables;v3v2" `
            --add-data "$v2JapaneseUnits;v3v2" `
            henkan_app.py
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller GUI build failed ($LASTEXITCODE)."
          }

      - name: Build internal console worker
        shell: pwsh
        run: |
          $idTables = (Resolve-Path "v3v2/idtables.json").Path
          $v2JapaneseUnits = (Resolve-Path "v3v2/v2_japanese_units.json").Path
          python -m PyInstaller --clean --noconfirm --onedir --console --name HenkanWorker `
            --contents-directory _henkan_worker_runtime `
            --distpath dist/worker --workpath build/worker --specpath build/spec-worker `
            --collect-all numpy --collect-all pywinauto `
            --hidden-import pythoncom --hidden-import pywintypes --hidden-import win32timezone `
            --hidden-import win32api --hidden-import win32con --hidden-import win32gui `
            --hidden-import win32process --hidden-import win32event --hidden-import win32com.client `
            --add-data "$idTables;v3v2" `
            --add-data "$v2JapaneseUnits;v3v2" `
            henkan_worker.py
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller worker build failed ($LASTEXITCODE)."
          }

      - name: Smoke-test frozen executables
        shell: pwsh
        run: |
          function Invoke-HenkanSmokeTest {
            param(
              [Parameter(Mandatory=$true)][string]$FilePath,
              [Parameter(Mandatory=$true)][string[]]$Arguments,
              [Parameter(Mandatory=$true)][string]$Name
            )

            $safeName = $Name -replace '[^A-Za-z0-9_.-]', '_'
            $stdout = Join-Path $env:RUNNER_TEMP "$safeName.stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "$safeName.stderr.log"
            Remove-Item $stdout, $stderr -Force -ErrorAction SilentlyContinue

            if (!(Test-Path $FilePath -PathType Leaf)) {
              throw "$Name executable not found: $FilePath"
            }

            $process = Start-Process `
              -FilePath (Resolve-Path $FilePath).Path `
              -ArgumentList $Arguments `
              -WorkingDirectory (Get-Location).Path `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru -Wait

            if (Test-Path $stdout) {
              Get-Content $stdout
            }
            if (Test-Path $stderr) {
              Get-Content $stderr
            }

            if ($process.ExitCode -ne 0) {
              throw "$Name failed (exit code $($process.ExitCode)). Logs: $stdout ; $stderr"
            }
          }

          $guiLog = Join-Path $env:RUNNER_TEMP "henkan-gui-self-test.log"
          Remove-Item $guiLog -Force -ErrorAction SilentlyContinue
          $env:HENKAN_SELF_TEST_LOG = $guiLog
          try {
            Invoke-HenkanSmokeTest -FilePath "dist/gui/Henkan/Henkan.exe" `
              -Arguments @("--self-test") -Name "Henkan GUI bundle self-test"

            if (!(Test-Path $guiLog -PathType Leaf)) {
              throw "Henkan GUI self-test exited successfully but did not create its diagnostic log."
            }
            $guiLogText = Get-Content $guiLog -Raw
            Write-Host $guiLogText
            if ($guiLogText -notmatch 'SELF-TEST PASSED') {
              throw "Henkan GUI self-test did not report success. Diagnostic log: $guiLog"
            }
          }
          finally {
            Remove-Item Env:HENKAN_SELF_TEST_LOG -ErrorAction SilentlyContinue
          }

          Invoke-HenkanSmokeTest -FilePath "dist/worker/HenkanWorker/HenkanWorker.exe" `
            -Arguments @("--cli", "--version") -Name "HenkanWorker CLI self-test"
          Invoke-HenkanSmokeTest -FilePath "dist/worker/HenkanWorker/HenkanWorker.exe" `
            -Arguments @("--qa") -Name "HenkanWorker Audio QA self-test"

      - name: Assemble Windows application ZIP
        shell: pwsh
        run: |
          $release = "dist/Henkan-Windows"
          $guiBundle = "dist/gui/Henkan"
          $workerBundle = "dist/worker/HenkanWorker"
          New-Item -ItemType Directory -Force -Path $release | Out-Null

          # Both onedir executables live at the ZIP root so the GUI's existing
          # APP_DIR/HenkanWorker.exe lookup continues to work. Keep each build's
          # support files in a uniquely named runtime directory to avoid collisions.
          Copy-Item "$guiBundle/Henkan.exe" $release
          Copy-Item "$workerBundle/HenkanWorker.exe" $release
          Copy-Item "$guiBundle/_henkan_gui_runtime" "$release/_henkan_gui_runtime" -Recurse
          Copy-Item "$workerBundle/_henkan_worker_runtime" "$release/_henkan_worker_runtime" -Recurse
          Copy-Item "README.md" $release
          Copy-Item "LICENSE" $release
          Copy-Item "BUILDING_WINDOWS.md" $release
          Copy-Item "SYSTEM_REQUIREMENTS.md" $release
          @'
          HENKAN — WINDOWS BUILD

          Launch Henkan.exe. Keep HenkanWorker.exe in the same folder; it is used internally
          for conversion, validation, DBTool automation, packaging and Audio QA. Keep both
          _henkan_gui_runtime and _henkan_worker_runtime folders beside the executables.
          Read SYSTEM_REQUIREMENTS.md or open PC Requirements in Henkan to check your PC.

          VocaloidDBTool3.exe and its phonetic dictionaries are external prerequisites.
          They are not bundled or downloaded by this build. Configure their paths in Henkan.
          '@ | Set-Content -Encoding UTF8 "$release/START-HERE.txt"
          $requiredPackagePaths = @(
            "$release/Henkan.exe",
            "$release/HenkanWorker.exe",
            "$release/_henkan_gui_runtime",
            "$release/_henkan_worker_runtime"
          )
          $missingPackagePaths = @($requiredPackagePaths | Where-Object { !(Test-Path $_) })
          if ($missingPackagePaths.Count -gt 0) {
            throw "The Windows package is incomplete: $($missingPackagePaths -join ', ')"
          }
          Compress-Archive -Path "$release/*" -DestinationPath "dist/Henkan-Windows.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Henkan-Windows
          path: dist/Henkan-Windows.zip
          if-no-files-found: error
          retention-days: 30
