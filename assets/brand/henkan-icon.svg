<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Henkan app icon</title>
  <desc id="desc">A sound waveform moves through an arrow and becomes a piano keyboard, representing voicebank conversion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202a3a"/>
      <stop offset="1" stop-color="#10151f"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f58aae"/>
      <stop offset="1" stop-color="#d6336c"/>
    </linearGradient>
    <clipPath id="keyClip"><rect x="646" y="366" width="250" height="292" rx="22"/></clipPath>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="226" fill="url(#bg)"/>
  <rect x="28" y="28" width="968" height="968" rx="222" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="8"/>
  <g>
    <!-- Incoming recorded audio: a deliberately simple waveform that survives small icon sizes. -->
    <g fill="url(#pink)">
      <rect x="132" y="448" width="56" height="128" rx="28"/>
      <rect x="218" y="386" width="56" height="252" rx="28"/>
      <rect x="304" y="310" width="56" height="404" rx="28"/>
      <rect x="390" y="405" width="56" height="214" rx="28"/>
    </g>
    <!-- Conversion arrow. -->
    <path d="M466 512H580" fill="none" stroke="#f8edf2" stroke-width="34" stroke-linecap="round"/>
    <path d="M548 458L608 512L548 566" fill="none" stroke="#f8edf2" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Destination: a compact piano keyboard / VOCALOID motif. -->
    <rect x="628" y="337" width="286" height="350" rx="38" fill="#f7f1f4"/>
    <g clip-path="url(#keyClip)">
      <rect x="646" y="366" width="250" height="292" fill="#fffafd"/>
      <path d="M729 366V658M812 366V658" stroke="#c9c1c9" stroke-width="7"/>
      <path d="M696 366V508H746V366M779 366V508H829V366" fill="#263244"/>
      <path d="M646 658H896" stroke="#d9d0d7" stroke-width="7"/>
    </g>
    <rect x="628" y="337" width="286" height="350" rx="38" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="6"/>
    <!-- Small pink accent: the converted output remains tied to the Henkan identity. -->
    <circle cx="856" cy="728" r="12" fill="#e45a87"/>
  </g>
</svg>
